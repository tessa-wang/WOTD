<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline · Word of the Day</title>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        color: #1a1a1b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 24px 0 8px;
      }
      p {
        color: #787c7e;
        line-height: 1.5;
        max-width: 300px;
        margin: 0;
      }
      button {
        margin-top: 28px;
        font: inherit;
        font-weight: 700;
        padding: 12px 28px;
        border: 1px solid #1a1a1b;
        border-radius: 8px;
        background: #1a1a1b;
        color: #ffffff;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Word of the Day needs the internet to load today’s words. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload by itself as soon as the connection comes back.
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
